<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Light by default; apply a saved dark choice before paint so it never flashes.
      try {
        if (localStorage.getItem("mr:theme") === "dark") document.documentElement.dataset.theme = "dark";
      } catch (e) {}
    </script>
    <title>Market Radar: the prediction market aggregator, funded from any coin</title>
    <meta name="description" content="One search across Polymarket, Kalshi, Limitless and Manifold. Fund the venue with the best price from any coin through NEAR Intents." />
    <meta property="og:title" content="Market Radar on NEAR" />
    <meta property="og:description" content="Find the best odds on any prediction market. Fund it from any coin, through NEAR Intents." />
    <link rel="icon" href="/radar.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  </head>

  </body>
</html>
